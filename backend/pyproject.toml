[project]
name = "carteira-estudantil-backend"
version = "1.0.0"
description = "Backend for Carteira Estudantil Web IFPE"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.2",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "httpx2==2.13.1",
    "wheel>=0.46.2",
    "jaraco-context>=6.1.0",
    "msgpack>=1.2.1",
    "pyjwt==2.15.1",
    "psycopg==3.3.6",
    "authlib==1.8.0",
    "itsdangerous>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff"
]

[tool.pytest.ini_options]
addopts = "-v --tb=short"
testpaths = ["tests"]
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore::DeprecationWarning:starlette.testclient"
]

[tool.ruff]
# Enable Pyflakes (F), pycodestyle (E, W), isort (I), and flake8-bandit (S)
lint.select = ["E", "F", "W", "I", "S"]
lint.ignore = []

# Allow autofix for all enabled rules (when `--fix`) is provided.
lint.fixable = ["ALL"]
lint.unfixable = []

# Allow unused variables when underscore-prefixed.
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 88

target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.uv]
override-dependencies = [
    "msgpack>=1.2.1"
]
