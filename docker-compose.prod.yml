services:
  db:
    image: postgres:15-alpine
    container_name: carteira_db_prod
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

  backend:
    image: ghcr.io/ifpebj-ti/carteira-backend:latest
    container_name: carteira_backend_prod
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
    depends_on:
      - db

  frontend:
    image: ghcr.io/ifpebj-ti/carteira-frontend:latest
    container_name: carteira_frontend_prod
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend

volumes:
  postgres_data_prod: