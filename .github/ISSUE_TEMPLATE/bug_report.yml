name: Relato de bug
description: Ajude a reproduzir um problema na aplicação ou na infraestrutura.
title: "[BUG]: "
body:
  - type: markdown
    attributes:
      value: |
        Não publique senhas, tokens JWT, QR codes válidos, matrículas ou outros dados pessoais. Remova esses dados também das capturas e dos logs.
  - type: dropdown
    id: component
    attributes:
      label: Componente afetado
      options:
        - Backend / API
        - Frontend / interface
        - Banco de dados
        - Docker / CI / publicação
        - Não sei
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão ou commit
      description: Informe a tag da imagem ou o resultado de git rev-parse HEAD.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamento observado
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Inicie a aplicação com...
        2. Acesse a tela ou endpoint...
        3. Observe...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ambiente
      description: Sistema operacional, arquitetura, navegador e versões de Docker/Compose, quando aplicável.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs sanitizados
      description: Inclua a mensagem exata e, para falhas de CI, o link da execução.
      render: text
  - type: checkboxes
    id: previous-search
    attributes:
      label: Antes de enviar
      options:
        - label: Pesquisei issues semelhantes e removi informações sensíveis.
          required: true
