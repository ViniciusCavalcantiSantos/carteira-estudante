repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.(md|markdown)$'
      - id: end-of-file-fixer
        exclude: '\.(md|markdown)$'
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: pytest-backend
        name: Run Backend Tests
        entry: bash -c 'if [ -f /.dockerenv ]; then pytest; elif command -v docker >/dev/null 2>&1; then docker compose run --rm backend pytest; else cd backend && uv run pytest; fi'
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false

      - id: frontend-format
        name: Frontend Prettier (Auto-format code)
        entry: bash -c 'if command -v npm >/dev/null 2>&1; then npm --prefix frontend exec --no-install -- prettier --write --ignore-unknown --ignore-path frontend/.prettierignore "$@"; else docker run --rm -u $(id -u):$(id -g) -v $(pwd):/workspace -w /workspace node:26-alpine npx --prefix frontend prettier --write --ignore-unknown --ignore-path frontend/.prettierignore "$@"; fi' --
        language: system
        types_or: [javascript, jsx, ts, tsx, css, json]
        files: ^frontend/
        pass_filenames: true

      - id: frontend-lint
        name: Frontend ESLint (Catch unused imports & bad code)
        entry: bash -c 'if command -v npm >/dev/null 2>&1; then cd frontend && npm run lint; else docker run --rm -u $(id -u):$(id -g) -e npm_config_cache=/tmp/.npm -v $(pwd)/frontend:/app -w /app node:26-alpine npm run lint; fi'
        language: system
        types_or: [javascript, jsx, ts, tsx]
        files: ^frontend/
        pass_filenames: false
